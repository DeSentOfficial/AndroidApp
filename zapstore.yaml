description: |
  **DeSent Email**

  Private email. No ads. No bs. Today. Tomorrow. Always.

  https://desent.xyz

  DeSent is a private email / personal productivity application built on top of
  Nostr. All events are stored as gift wraps sent to and from the relay. Once
  an email comes into the relay it's wrapped and sent to the NIP-05's
  recipient. Nothing is stored on the central servers in plain text.

  Create an account through your existing Nostr keys, create a custodial one
  using username and password, or a crypto wallet.

  ## Features

  - Email
  - Calendar
  - Notes
  - Contacts
  - Files
  - Bunker Signing Service
  - Light / Dark Mode
  - Widgets
  - Multiple Account support
  - Account Exporting
  - AI Inbox (Openclaw)
  - Relay Mirroring (Premium)
  - Key Rotation For Custodial Accounts (Premium)
  - Aliases (More for purchase)
  - Premium Alias names (Charged by character count only)

  **Payments / Refunds:** All payments are settled through the Bitcoin
  Lightning Network. Please see the website for refund policy.

