name: DeSent
summary: Private email and personal productivity on Nostr
description: |
  DeSent — a play on *desent* (decentralized via Nostr) and *sent* (email) — is a
  privacy-focused Android app for private email and personal productivity.

  - **Private email** — Nostr-native email with a client-side spam filter
  - **Encrypted calendar** — NIP-52 calendar with sharing and RSVPs
  - **Private notes & contacts** — NIP-78 self-encrypted private storage
  - **File storage** — encrypted blob storage on desent.xyz
  - **Secure key management** — keys in the Android Keystore with biometric access
  - **NIP-46 remote signing** — use this phone as a bunker for your other devices
  - **Wear OS companion** — watch app synced from the phone

  Accounts sync exclusively through the DeSent service relay at `wss://desent.xyz`;
  third-party relays are only ever contacted read-only, briefly, to fetch an
  existing Nostr user's profile during login.
