# Android Studio build performance optimizations
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
# Use AndroidX
android.useAndroidX=true
# Enable R8 full mode
android.enableR8.fullMode=true
# Disable JDK image transform (workaround for missing jlink)
android.disableJdkImageTransform=true
# Disable the problematic JDK image transform
android.enableBuildConfigDeprecations=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# compileSdk 36 is above AGP 8.6's tested max (35). API 36 is required by
# Google Play for new apps; the compile works fine against the newer android.jar.
android.suppressUnsupportedCompileSdk=36
